<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pipeline trace</title>
<style>
:root{--ink:#1d2430;--mute:#6b7280;--line:#d9dee7;--bg:#f6f7f9;--card:#fff;--acc:#2563eb;--ok:#15803d;--bad:#b91c1c;--add:#dcfce7;--del:#fee2e2}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 "Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;color:var(--ink);background:var(--bg);padding-bottom:70px}
header{padding:14px 24px;background:var(--card);border-bottom:1px solid var(--line)}
h1{font-size:18px;margin:0 0 4px}
.meta span{display:inline-block;margin-right:14px;color:var(--mute);font-size:13px}
.flow{position:relative;display:flex;gap:4px;padding:12px 24px 22px;background:var(--card);border-bottom:1px solid var(--line)}
.chip{flex:1 1 0;min-width:0;padding:6px 4px;border:1px solid var(--line);border-radius:8px;font-size:12px;background:#fff;color:var(--mute);cursor:pointer;transition:background .4s,border-color .4s,color .4s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.done{color:var(--ink)}
.chip.on{border-color:var(--acc);background:#eff6ff;color:var(--ink);font-weight:600}
.packet{position:absolute;bottom:6px;left:24px;width:12px;height:12px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 4px #dbeafe;transition:left .6s ease;pointer-events:none}
main{max-width:1180px;margin:0 auto;padding:18px 24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px 20px;transition:opacity .35s ease,transform .35s ease}
.card.hide{opacity:0;transform:translateY(8px)}
h2{font-size:17px;margin:0 0 4px}
.what{color:var(--mute);margin:0 0 14px}
.io,.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
@media(max-width:820px){.io,.cols{grid-template-columns:1fr}}
.col{border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-width:0;background:#fcfdfe}
.blk{margin-bottom:12px}
.blk:last-child{margin-bottom:0}
h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:0 0 6px}
.row{display:grid;grid-template-columns:minmax(80px,max-content) 1fr;gap:2px 10px;padding:5px 0;border-bottom:1px dashed var(--line)}
.row:last-child{border-bottom:0}
.k{font:12px ui-monospace,Menlo,monospace;color:var(--acc);word-break:break-all}
.t{white-space:pre-wrap;word-break:break-word}
.m{font-size:12px;color:var(--mute);margin:4px 0}
.row .m{grid-column:2;margin:0}
pre{white-space:pre-wrap;word-break:break-word;margin:0;font:13px/1.45 ui-monospace,Menlo,monospace}
.ln{white-space:pre-wrap;word-break:break-word;font:13px/1.45 ui-monospace,Menlo,monospace;padding:0 4px}
.ln.ins{background:var(--add)}
.ln.del{background:var(--del)}
.clip{max-height:220px;overflow:hidden}
.clip.open{max-height:none}
img{max-width:100%;display:block;border:1px solid var(--line)}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:6px;padding:5px 12px}
button:disabled{opacity:.4;cursor:default}
button.more{display:block;margin-top:6px;font-size:12px;color:var(--acc);border:0;background:none;padding:0}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;color:#fff;background:var(--mute);margin-bottom:8px}
.badge.correct{background:var(--ok)}
.badge.incorrect{background:var(--bad)}
.controls{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 24px;display:flex;align-items:center;gap:10px}
.bar{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .4s}
.count{font-size:13px;color:var(--mute);min-width:64px;text-align:right}
</style>
</head>
<body>
<header>
  <h1 id="title"></h1>
  <div class="meta" id="meta"></div>
</header>
<nav class="flow" id="flow" aria-label="Pipeline stages"><div class="packet" id="packet"></div></nav>
<main>
  <section class="card" id="panel" aria-live="polite"></section>
</main>
<div class="controls">
  <button id="prev" type="button">← Prev</button>
  <button id="play" type="button">Play</button>
  <button id="next" type="button">Next →</button>
  <div class="bar"><i id="bar"></i></div>
  <div class="count" id="count"></div>
</div>
<script>
const DATA = __TRACE_DATA__;
(() => {
  "use strict";
  const $ = (s) => document.querySelector(s);
  // All page text enters through textContent or attribute setters, never innerHTML.
  const el = (tag, cls, text) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  };
  const stages = DATA.stages;
  const last = stages.length - 1;
  let i = 0;
  let timer = null;

  // Long content sits in a clipped wrapper; a "show all" button appears only when it overflows the clip.
  const clipped = (node) => { const w = el("div", "clip"); w.appendChild(node); return w; };
  function fitClips() {
    document.querySelectorAll("#panel .clip").forEach((w) => {
      if (w.scrollHeight <= w.clientHeight + 2) { w.classList.remove("clip"); return; }
      const b = el("button", "more", "show all");
      b.type = "button";
      b.onclick = () => { const open = w.classList.toggle("open"); b.textContent = open ? "collapse" : "show all"; };
      w.after(b);
    });
  }

  function block(b) {
    const node = el("div", "blk");
    node.appendChild(el("h3", "", b.label));
    if (b.t === "text") {
      node.appendChild(clipped(el("pre", "", b.text)));
    } else if (b.t === "rows") {
      const body = el("div");
      for (const r of b.rows) {
        const row = el("div", "row");
        row.append(el("div", "k", r.key), el("div", "t", r.text));
        if (r.meta) row.appendChild(el("div", "m", r.meta));
        body.appendChild(row);
      }
      node.appendChild(clipped(body));
    } else if (b.t === "img") {
      const im = el("img");
      im.src = b.src;
      im.alt = b.label;
      node.append(im, el("div", "m", b.caption));
    }
    return node;
  }

  function column(label, nodes) {
    const box = el("div", "col");
    box.appendChild(el("h3", "", label));
    box.append(...nodes);
    return box;
  }

  // Prompt A (flag off) beside prompt B (fact rows added). Each column shows the shared lines and its own changed lines, highlighted.
  function promptView() {
    const c = DATA.compare;
    const side = (label, keep) => {
      const nodes = [];
      for (const part of ["system", "user"]) {
        nodes.push(el("div", "m", part === "system" ? "system message" : "user message"));
        const body = el("div");
        for (const [tag, line] of c.diff[part]) {
          if (tag !== "eq" && tag !== keep) continue;
          body.appendChild(el("div", tag === "eq" ? "ln" : `ln ${tag}`, line || "\u00a0"));
        }
        nodes.push(clipped(body));
      }
      return column(label, nodes);
    };
    const wrap = el("div", "cols");
    wrap.append(side(`${c.a.label} · ${c.a.chars} chars`, "del"), side(`${c.b.label} · ${c.b.chars} chars`, "ins"));
    return wrap;
  }

  function answerCard(a) {
    const nodes = [];
    if (a.answer === null) {
      nodes.push(el("div", "m", "no recorded run"));
    } else {
      const verdict = a.verdict || "";
      nodes.push(el("span", `badge ${verdict}`, verdict || "not graded"));
      nodes.push(el("div", "m", `grade field: ${a.grade || "none"}`));
      nodes.push(clipped(el("pre", "", a.answer)));
      if (a.evidence.length) nodes.push(el("div", "m", `evidence: ${a.evidence.join(", ")}`));
      if (a.facts.length) nodes.push(el("div", "m", `fact rows: ${a.facts.join(", ")}`));
      for (const line of a.computed) nodes.push(el("div", "m", `computed: ${line}`));
    }
    return column(a.label, nodes);
  }

  function answersView() {
    const wrap = el("div");
    wrap.appendChild(column("Reference", [clipped(el("pre", "", DATA.reference || "(none)"))]));
    wrap.lastChild.style.marginBottom = "14px";
    const cols = el("div", "cols");
    cols.append(answerCard(DATA.answers.a), answerCard(DATA.answers.b));
    wrap.appendChild(cols);
    return wrap;
  }

  function renderStage(st) {
    const panel = $("#panel");
    panel.replaceChildren(el("h2", "", st.title), el("p", "what", st.what));
    if (st.view === "answers") {
      panel.appendChild(answersView());
      return;
    }
    const io = el("div", "io");
    io.appendChild(column("Input", st.input.map(block)));
    if (st.view !== "prompt") io.appendChild(column("Output", st.output.map(block)));
    panel.appendChild(io);
    if (st.view === "prompt") panel.appendChild(promptView());
  }

  function updateFlow() {
    document.querySelectorAll(".chip").forEach((c, n) => {
      c.classList.toggle("on", n === i);
      c.classList.toggle("done", n < i);
    });
    const f = last ? i / last : 0;
    $("#packet").style.left = `calc(24px + (100% - 60px) * ${f})`;
    $("#bar").style.width = `${f * 100}%`;
    $("#count").textContent = `${i + 1} / ${stages.length}`;
    $("#prev").disabled = i === 0;
    $("#next").disabled = i === last;
  }

  function show() {
    const panel = $("#panel");
    panel.classList.add("hide");
    renderStage(stages[i]);
    fitClips();
    updateFlow();
    requestAnimationFrame(() => requestAnimationFrame(() => panel.classList.remove("hide")));
  }

  function go(n) {
    i = Math.max(0, Math.min(last, n));
    show();
  }

  function setPlaying(on) {
    clearInterval(timer);
    if (on && i === last) go(0);
    timer = on ? setInterval(() => { if (i >= last) setPlaying(false); else go(i + 1); }, 4000) : null;
    $("#play").textContent = on ? "Pause" : "Play";
  }

  function buildChrome() {
    const m = DATA.meta;
    $("#title").textContent = DATA.title;
    for (const [k, v] of [["question", m.question_id], ["category", m.category], ["difficulty", m.difficulty],
                          ["LLM", m.llm], ["context", m.context], ["top-k", m.top]]) {
      if (v !== "" && v !== undefined && v !== null) $("#meta").appendChild(el("span", "", `${k}: ${v}`));
    }
    stages.forEach((st, n) => {
      const c = el("button", "chip", st.short);
      c.type = "button";
      c.title = st.title;
      c.onclick = () => { setPlaying(false); go(n); };
      $("#flow").insertBefore(c, $("#packet"));
    });
  }

  $("#prev").onclick = () => { setPlaying(false); go(i - 1); };
  $("#next").onclick = () => { setPlaying(false); go(i + 1); };
  $("#play").onclick = () => setPlaying(timer === null);
  document.addEventListener("keydown", (e) => {
    if (e.key === "ArrowRight") { setPlaying(false); go(i + 1); }
    else if (e.key === "ArrowLeft") { setPlaying(false); go(i - 1); }
    else if (e.key === " ") { e.preventDefault(); setPlaying(timer === null); }
  });

  buildChrome();
  show();
})();
</script>
</body>
</html>
