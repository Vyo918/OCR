# docker compose run --rm docsearch build           # OCR + index the PDFs in $DOCS_DIR
# docker compose run --rm docsearch ask "消防泵浦幾HP?"
# (./docsearch.sh wraps this and passes your uid/gid so generated files are yours)
services:
  docsearch:
    image: docsearch:latest
    build:
      context: .
      args:
        BAKE_MODELS: ${BAKE_MODELS:-0}
    user: "${DOCSEARCH_UID:-1000}:${DOCSEARCH_GID:-1000}"
    environment:
      HF_TOKEN: ${HF_TOKEN:-}                 # optional: faster / higher-limit model downloads
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-0}    # set to 1 once models are cached to forbid any network
      DOCSEARCH_OCR_ENGINE: ${DOCSEARCH_OCR_ENGINE:-}   # empty = the built-in default (see docsearch/config.py)
    volumes:
      - ${DOCS_DIR:-./docs}:/data/in:ro       # your PDFs / images
      - ${WORK_DIR:-./work}:/data/work        # OCR json, index, crops, benchmark reports
      - ${MODELS_DIR:-models}:/models         # model weights (named volume, or a host path such as ~/.cache/huggingface)
    stdin_open: true
    tty: true
    shm_size: 2gb
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  web:
    image: docsearch:latest
    build:
      context: .
      args:
        BAKE_MODELS: ${BAKE_MODELS:-0}
    user: "${DOCSEARCH_UID:-1000}:${DOCSEARCH_GID:-1000}"
    command: ["serve", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "${DOCSEARCH_BIND:-127.0.0.1}:8000:8000"   # default loopback; set to a tailnet address to opt in (see README)
    environment:
      DOCSEARCH_WORK: /data/work
      HF_HOME: /models
      HF_TOKEN: ${HF_TOKEN:-}
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-0}
      DOCSEARCH_OCR_ENGINE: ${DOCSEARCH_OCR_ENGINE:-}
      DOCSEARCH_ALLOWED_HOSTS: ${DOCSEARCH_ALLOWED_HOSTS:-}   # extra Host names allowed besides localhost/127.0.0.1/::1
    volumes:
      - ${WORK_DIR:-./work}:/data/work
      - ${MODELS_DIR:-models}:/models
    shm_size: 2gb
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  models:
